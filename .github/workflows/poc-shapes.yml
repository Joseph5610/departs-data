name: PoC route shapes (pfaedle)

# Temporary: draws shapes for a few DÚK lines with pfaedle on OSM, to judge the approach.
on:
  push:
    branches: [claude/nifty-faraday-0ozw3e]
    paths: ['scripts/poc/**', '.github/workflows/poc-shapes.yml']
  workflow_dispatch:

jobs:
  shapes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Mini GTFS of sample lines
        run: node scripts/poc/shapes-gtfs.ts poc/gtfs 595070 595088 595085 592450 592458 U1 U3
      - name: OSM extract of the kraj
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -sSfL -o cz.osm.pbf https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf
          mkdir -p poc/osm
          osmium extract -b 12.9,50.1,14.75,51.1 cz.osm.pbf -o poc/osm/duk.osm.pbf --overwrite
          osmium tags-filter poc/osm/duk.osm.pbf w/highway=motorway,trunk,primary,secondary,tertiary,residential,unclassified,service w/railway=rail -o poc/roads.osm.pbf --overwrite
          osmium export poc/roads.osm.pbf -f geojsonseq -o poc/roads.geojsonseq --overwrite
          ls -la poc/osm
      - name: pfaedle
        run: |
          (cd poc/gtfs && zip -q ../feed.zip *.txt) && mkdir -p poc/feed poc/gtfs-out && mv poc/feed.zip poc/feed/
          /usr/bin/time -v docker run -i --rm -v "$PWD/poc/osm:/osm" -v "$PWD/poc/feed:/gtfs" -v "$PWD/poc/gtfs-out:/gtfs-out" \
            ghcr.io/ad-freiburg/pfaedle:latest -D -x /osm/duk.osm.pbf -i /gtfs/feed.zip 2>&1 | tail -40
          ls -la poc/gtfs-out
      - name: Plot
        run: |
          pip install -q matplotlib
          python3 scripts/poc/plot.py poc
      - uses: actions/upload-artifact@v4
        with:
          name: poc-shapes
          path: poc/out
