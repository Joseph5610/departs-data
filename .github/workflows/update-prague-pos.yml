name: Update Prague Points of Sale Data

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-pos-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and format points of sale
        run: node scripts/build-prague-pos.mjs

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "feat: automated Prague points of sale update"
          file_pattern: "prague/points-of-sale.json"
