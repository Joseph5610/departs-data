name: Update Prague Stops Data

on:
  schedule:
    - cron: '30 1 * * *' # Every day at 01:30 UTC (03:30 CEST)
  workflow_dispatch: # Allow manual trigger

concurrency:
  # All builds force-push the same single-commit data branch, so they must not overlap.
  group: data-branch
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v5

      - name: Checkout published data
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The build reads some of its own previous output back (alias chains) and leaves files it
      # did not regenerate in place, so stage a copy of what is published rather than an empty dir.
      - name: Seed staging from published data
        run: |
          mkdir -p out
          cp -a data-branch/prague out/prague

      - name: Fetch and format stops
        run: node scripts/build-prague.ts
        env:
          OUT_DIR: ${{ github.workspace }}/out/prague
          GOLEMIO_API_KEY: ${{ secrets.GOLEMIO_API_KEY }}

      - name: Build connections from PID GTFS
        run: node scripts/build-prague-connections.ts
        env:
          OUT_DIR: ${{ github.workspace }}/out/prague

      # The data branch holds exactly one commit, so publishing amends it. --force-with-lease
      # refuses if the branch moved while we were building; on a lease failure we re-apply this
      # city's output onto the new tip and retry, so a concurrent run is never overwritten.
      - name: Publish data
        working-directory: data-branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          for attempt in 1 2 3; do
            git fetch --depth=1 origin data
            git reset -q --hard origin/data
            rm -rf prague
            cp -a "$GITHUB_WORKSPACE/out/prague" prague
            git add -A prague
            if git diff --cached --quiet; then
              echo "No data change; nothing to publish."
              exit 0
            fi
            git commit -q --amend --no-edit --reset-author
            if git push --force-with-lease=data:$(git rev-parse origin/data) origin data; then
              echo "Published on attempt $attempt."
              exit 0
            fi
            echo "Branch moved while building; retrying ($attempt)."
          done
          echo "Could not publish after 3 attempts." >&2
          exit 1
