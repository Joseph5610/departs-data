name: Learn DÚK Platforms

on:
  schedule:
    - cron: '17 * * * *' # Hourly: boards reach about two hours ahead, so a day of runs covers every departure
  workflow_dispatch: # Allow manual trigger

jobs:
  learn:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Learn platforms from live boards and vehicles
        run: node scripts/learn-duk-platforms.mjs

      # Other data workflows push to the same branch; start from their latest commit.
      - name: Rebase onto the latest data
        run: git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com pull --rebase --autostash origin ${{ github.ref_name }}

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "feat: automated DÚK platform hints update"
          file_pattern: "duk/platform_hints.json"
