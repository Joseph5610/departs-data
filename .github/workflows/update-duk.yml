name: Update DÚK JDF Data

on:
  schedule:
    - cron: '51 1 * * *' # Every day at 01:51 UTC (03:51 CEST); CIS JŘ republishes the export each evening
  push: # Rebuild when the pipeline itself changes
    branches: [master]
    paths:
      - 'scripts/build-duk.ts'
      - '.github/workflows/update-duk.yml'
  workflow_dispatch: # Allow manual trigger

concurrency:
  # All builds force-push the same single-commit data branch, so they must not overlap.
  group: data-branch
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v5

      - name: Checkout published data
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Download and Process JDF
        run: node scripts/build-duk.ts
        env:
          OUT_DIR: ${{ github.workspace }}/data-branch/duk

      # The data branch holds exactly one commit: amend it so no history accumulates.
      - name: Publish data
        working-directory: data-branch
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A duk
          if git diff --cached --quiet; then
            echo "No data change; nothing to publish."
            exit 0
          fi
          git commit --amend --no-edit
          git push --force origin data
