name: Update Brno GTFS Data

on:
  schedule:
    - cron: '19 1 * * *' # Every day at 01:19 UTC (03:19 CEST)
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Download and Process GTFS
        run: node scripts/build-brno.mjs
        env:
          LISSY_API_TOKEN: ${{ secrets.LISSY_API_TOKEN }}

      # Other data workflows push to the same branch; start from their latest commit.
      - name: Rebase onto the latest data
        run: git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com pull --rebase --autostash origin ${{ github.ref_name }}

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "feat: automated GTFS data update with chunking"
          file_pattern: "brno/"
